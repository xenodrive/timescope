packages:
  - packages/*

update:
  githubActions: true

# Compatibility holds (2026-10):
# - Vue/Svelte need TypeScript 6's compiler API and typescript-eslint (<6.1).
# - Solid's Oxlint JS plugin still depends on @typescript-eslint/utils (<6.1).
# - VitePress 2.0.0-alpha.20 requires markdown-it-mathjax3 ^4, not ^5.

allowBuilds:
  esbuild: true
  skia-canvas: true

overrides:
  '@xmldom/xmldom@>=0.9.0 <=0.9.10': ^0.9.12
  '@xmldom/xmldom@>=0.9.0 <=0.9.11': ^0.9.12
  '@xmldom/xmldom@>=0.9.0-beta.1 <=0.9.11': ^0.9.12
  '@xmldom/xmldom@>=0.9.0-beta.9 <=0.9.10': ^0.9.12
  '@xmldom/xmldom@>=0.9.10 <=0.9.11': ^0.9.12

minimumReleaseAgeExclude:
  # Includes the patched seroval 1.6.8 dependency.
  - solid-js@1.9.16
