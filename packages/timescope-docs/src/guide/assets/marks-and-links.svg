<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <title>Marks and links composing a chart</title>
  <desc>Circle marks represent individual rows. A line link connects consecutive rows, and an area link fills a band between two values across those rows.</desc>

  <!-- Row times. -->
  <g stroke="#94a3b8" stroke-dasharray="4 3" opacity="0.25">
    <line x1="80" y1="60" x2="80" y2="245"/>
    <line x1="180" y1="60" x2="180" y2="245"/>
    <line x1="280" y1="60" x2="280" y2="245"/>
    <line x1="380" y1="60" x2="380" y2="245"/>
    <line x1="480" y1="60" x2="480" y2="245"/>
  </g>

  <!-- Area and line links connect values across rows. -->
  <polygon points="80,150 180,80 280,120 380,60 480,95 480,155 380,120 280,180 180,140 80,210" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1"/>
  <polyline points="80,180 180,110 280,150 380,90 480,125" fill="none" stroke="#3b82f6" stroke-width="2"/>

  <!-- One circle mark per row. -->
  <g fill="#3b82f6">
    <circle cx="80" cy="180" r="5"/>
    <circle cx="180" cy="110" r="5"/>
    <circle cx="280" cy="150" r="5"/>
    <circle cx="380" cy="90" r="5"/>
    <circle cx="480" cy="125" r="5"/>
  </g>

  <!-- Primitive callouts. -->
  <g fill="none" stroke="#64748b">
    <circle cx="180" cy="110" r="12"/>
    <line x1="165" y1="40" x2="177" y2="98"/>
    <line x1="430" y1="40" x2="430" y2="107.5"/>
    <line x1="125" y1="216" x2="140" y2="160"/>
  </g>
  <g font-size="17" fill="#64748b">
    <text x="165" y="30" text-anchor="middle">mark</text>
    <text x="430" y="30" text-anchor="middle">line link</text>
    <text x="40" y="222">area link</text>
  </g>
  <circle cx="430" cy="107.5" r="3" fill="#3b82f6"/>
  <circle cx="140" cy="160" r="3" fill="#f59e0b"/>

  <!-- Shared horizontal time coordinate. -->
  <line x1="40" y1="245" x2="520" y2="245" stroke="#64748b" stroke-width="1.5"/>
  <path d="M530 245 l-10 -5 v10 z" fill="#64748b"/>
  <text x="530" y="269" text-anchor="end" font-size="16" fill="#64748b">time</text>
</svg>
