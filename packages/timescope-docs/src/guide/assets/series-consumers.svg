<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" role="img" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <title>Series and example consumers</title>
  <desc>Series provide information to consumers with different roles. For example, Charts use series data and Tooltips use instantaneous values.</desc>
  <defs>
    <marker id="consumer-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="240" y="20" width="300" height="50" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="53" text-anchor="middle" font-size="25" fill="#3b82f6">Series</text>

  <path d="M390 70 V100 H180 M390 100 H600" fill="none" stroke="#64748b"/>
  <g fill="none" stroke="#64748b" marker-end="url(#consumer-flow)">
    <path d="M180 100 V195"/>
    <path d="M600 100 V195"/>
  </g>
  <g font-size="22" fill="#64748b">
    <text x="196" y="150">series data</text>
    <text x="616" y="136">instantaneous</text>
    <text x="616" y="164">value</text>
  </g>

  <rect x="40" y="185" width="700" height="103" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g fill="none" stroke="#3b82f6" stroke-width="1.5">
    <rect x="60" y="202" width="240" height="50" rx="8"/>
    <rect x="480" y="202" width="240" height="50" rx="8"/>
  </g>
  <g font-size="24" fill="#3b82f6" text-anchor="middle">
    <text x="180" y="235">Chart</text>
    <text x="600" y="235">Tooltip</text>
  </g>
  <text x="390" y="280" text-anchor="middle" font-size="21" fill="#64748b">Consumers</text>
</svg>
