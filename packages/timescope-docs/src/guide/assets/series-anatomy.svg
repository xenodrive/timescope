<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" role="img" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <title>Series anatomy: marks, links, tracks, domains</title>

  <!-- shared time gridlines -->
  <g stroke="#94a3b8" stroke-dasharray="4 3" opacity="0.25">
    <line x1="100" y1="40" x2="100" y2="440"/>
    <line x1="240" y1="40" x2="240" y2="440"/>
    <line x1="380" y1="40" x2="380" y2="440"/>
    <line x1="520" y1="40" x2="520" y2="440"/>
    <line x1="660" y1="40" x2="660" y2="440"/>
  </g>

  <!-- tracks -->
  <rect x="20" y="40" width="720" height="220" fill="rgba(148,163,184,0.06)" stroke="#94a3b8"/>
  <rect x="20" y="300" width="720" height="140" fill="rgba(148,163,184,0.06)" stroke="#94a3b8"/>

  <!-- domain axis + callout -->
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="20" y1="60" x2="28" y2="60"/>
    <line x1="20" y1="150" x2="28" y2="150"/>
    <line x1="20" y1="240" x2="28" y2="240"/>
  </g>
  <ellipse cx="24" cy="150" rx="16" ry="106" fill="none" stroke="#64748b"/>
  <text x="16" y="26" font-size="16" fill="#64748b">domain — °C</text>
  <line x1="46" y1="30" x2="28" y2="44" stroke="#64748b" stroke-width="1"/>

  <!-- area link [min, max] -->
  <polygon points="100,170 240,90 380,135 520,55 660,105 660,175 520,125 380,205 240,165 100,235" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1"/>

  <!-- line link -->
  <polyline points="100,200 240,120 380,165 520,85 660,135" fill="none" stroke="#3b82f6" stroke-width="2"/>

  <!-- marks -->
  <g fill="#3b82f6">
    <circle cx="100" cy="200" r="5"/>
    <circle cx="240" cy="120" r="5"/>
    <circle cx="380" cy="165" r="5"/>
    <circle cx="520" cy="85" r="5"/>
    <circle cx="660" cy="135" r="5"/>
  </g>

  <!-- overview series -->
  <polyline points="100,400 240,350 380,375 520,330 660,365" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>

  <!-- series labels -->
  <text x="585" y="60" font-size="16" fill="#3b82f6">temperature</text>
  <text x="585" y="215" font-size="16" fill="#f59e0b">min · max</text>

  <!-- callouts -->
  <ellipse cx="380" cy="165" rx="13" ry="13" fill="none" stroke="#64748b"/>
  <text x="295" y="70" font-size="16" fill="#64748b">mark</text>
  <line x1="315" y1="76" x2="369" y2="153" stroke="#64748b" stroke-width="1"/>

  <text x="470" y="288" font-size="16" fill="#64748b">link</text>
  <line x1="466" y1="274" x2="452" y2="132" stroke="#64748b" stroke-width="1"/>

  <text x="40" y="288" font-size="16" fill="#64748b">area link [min, max]</text>
  <line x1="85" y1="274" x2="140" y2="203" stroke="#64748b" stroke-width="1"/>

  <text x="760" y="154" font-size="16" fill="#64748b">track: detail</text>
  <line x1="756" y1="150" x2="740" y2="150" stroke="#64748b" stroke-width="1"/>
  <text x="760" y="374" font-size="16" fill="#64748b">track: overview</text>
  <line x1="756" y1="370" x2="740" y2="370" stroke="#64748b" stroke-width="1"/>

  <!-- time axis -->
  <line x1="20" y1="470" x2="840" y2="470" stroke="#64748b" stroke-width="1.5"/>
  <path d="M848 470 l-10 -5 v10 z" fill="#64748b"/>
  <g stroke="#64748b" stroke-width="1">
    <line x1="100" y1="465" x2="100" y2="475"/>
    <line x1="240" y1="465" x2="240" y2="475"/>
    <line x1="380" y1="465" x2="380" y2="475"/>
    <line x1="520" y1="465" x2="520" y2="475"/>
    <line x1="660" y1="465" x2="660" y2="475"/>
  </g>
  <g font-size="15" fill="#64748b" text-anchor="middle">
    <text x="100" y="498">10:00</text>
    <text x="240" y="498">10:15</text>
    <text x="380" y="498">10:30</text>
    <text x="520" y="498">10:45</text>
    <text x="660" y="498">11:00</text>
  </g>
  <text x="430" y="530" text-anchor="middle" font-size="16" fill="#64748b">time axis — shared by tracks</text>
</svg>
