<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <title>Time, zoom, and resolution relationships</title>

  <desc>For a fixed view width, increasing zoom by one halves the visible time span around time. timeRange bounds the center time; zoomRange bounds the zoom level.</desc>

  <!-- outside timeRange: same background as Timescope -->
  <g fill="#00000010">
    <rect x="40" y="55" width="60" height="330"/>
    <rect x="500" y="55" width="260" height="330"/>
  </g>

  <!-- row baselines -->
  <g stroke="#94a3b8">
    <line x1="40" y1="70" x2="760" y2="70" stroke-dasharray="4 3" opacity="0.3"/>
    <line x1="40" y1="120" x2="760" y2="120" opacity="0.5"/>
    <line x1="40" y1="170" x2="760" y2="170" opacity="0.5"/>
    <line x1="40" y1="220" x2="760" y2="220" opacity="0.5"/>
    <line x1="40" y1="270" x2="760" y2="270" opacity="0.5"/>
    <line x1="40" y1="320" x2="760" y2="320" opacity="0.5"/>
    <line x1="40" y1="370" x2="760" y2="370" stroke-dasharray="4 3" opacity="0.3"/>
  </g>

  <!-- visible time span at each zoom level -->
  <g stroke="#3b82f6" stroke-width="2">
    <line x1="380" y1="120" x2="420" y2="120"/>
    <line x1="360" y1="170" x2="440" y2="170"/>
    <line x1="320" y1="220" x2="480" y2="220"/>
    <line x1="240" y1="270" x2="560" y2="270"/>
    <line x1="80" y1="320" x2="720" y2="320"/>
  </g>

  <!-- visible-range envelope -->
  <polyline points="380,120 360,170 320,220 240,270 80,320" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polyline points="420,120 440,170 480,220 560,270 720,320" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="324" y="199" text-anchor="end" font-size="26" fill="#3b82f6">visible range</text>
  <line x1="328" y1="194" x2="340" y2="195" stroke="#3b82f6"/>
  <circle cx="340" cy="195" r="2.5" fill="#3b82f6"/>

  <!-- time cursor -->
  <line x1="400" y1="55" x2="400" y2="385" stroke="#ef4444" stroke-width="1.5"/>
  <text x="400" y="413" text-anchor="middle" font-size="26" fill="#ef4444">time</text>

  <!-- timeRange -->
  <line x1="100" y1="55" x2="100" y2="385" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <line x1="500" y1="55" x2="500" y2="385" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <text x="100" y="446" text-anchor="middle" font-size="26" fill="#f59e0b">timeRange[0]</text>
  <text x="500" y="446" text-anchor="middle" font-size="26" fill="#f59e0b">timeRange[1]</text>

  <!-- zoom axis -->
  <line x1="56" y1="320" x2="56" y2="120" stroke="#64748b" stroke-width="1.5"/>
  <path d="M56 110 l-5 10 h10 z" fill="#64748b"/>
  <text x="50" y="36" font-size="28" fill="#64748b">zoom</text>

  <!-- zoom level labels -->
  <text x="36" y="64" text-anchor="end" font-size="25" fill="#64748b" opacity="0.4">+3</text>
  <text x="36" y="114" text-anchor="end" font-size="25" fill="#64748b">+2</text>
  <text x="36" y="164" text-anchor="end" font-size="25" fill="#64748b">+1</text>
  <text x="36" y="214" text-anchor="end" font-size="25" fill="#64748b">0</text>
  <text x="36" y="264" text-anchor="end" font-size="25" fill="#64748b">−1</text>
  <text x="36" y="314" text-anchor="end" font-size="25" fill="#64748b">−2</text>
  <text x="36" y="364" text-anchor="end" font-size="25" fill="#64748b" opacity="0.4">−3</text>

  <!-- zoomRange -->
  <line x1="790" y1="120" x2="790" y2="320" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="790" y1="120" x2="782" y2="120" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="790" y1="320" x2="782" y2="320" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="808" y="220" text-anchor="middle" font-size="26" fill="#f59e0b" transform="rotate(90 808 220)">zoomRange [min, max]</text>

</svg>
