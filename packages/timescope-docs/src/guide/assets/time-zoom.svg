<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <title>time, timeRange, zoom, zoomRange relationships</title>

  <defs>
    <clipPath id="timeline-clip">
      <rect x="40" y="55" width="720" height="330"/>
    </clipPath>
    <pattern id="t10" x="40" y="115" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0.5" y1="0" x2="0.5" y2="10" stroke="#64748b" stroke-width="1"/>
    </pattern>
    <pattern id="t20" x="40" y="165" width="20" height="10" patternUnits="userSpaceOnUse">
      <line x1="0.5" y1="0" x2="0.5" y2="10" stroke="#64748b" stroke-width="1"/>
    </pattern>
    <pattern id="t40" x="40" y="215" width="40" height="10" patternUnits="userSpaceOnUse">
      <line x1="0.5" y1="0" x2="0.5" y2="10" stroke="#64748b" stroke-width="1"/>
    </pattern>
    <pattern id="t80" x="40" y="265" width="80" height="10" patternUnits="userSpaceOnUse">
      <line x1="0.5" y1="0" x2="0.5" y2="10" stroke="#64748b" stroke-width="1"/>
    </pattern>
    <pattern id="t160" x="40" y="315" width="160" height="10" patternUnits="userSpaceOnUse">
      <line x1="0.5" y1="0" x2="0.5" y2="10" stroke="#64748b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- outside timeRange: same background as Timescope -->
  <g fill="#00000010">
    <rect x="40" y="55" width="60" height="330"/>
    <rect x="500" y="55" width="260" height="330"/>
  </g>

  <!-- row baselines -->
  <g stroke="#94a3b8">
    <line x1="40" y1="70" x2="760" y2="70" stroke-dasharray="4 3" opacity="0.3"/>
    <line x1="40" y1="120" x2="760" y2="120" opacity="0.5"/>
    <line x1="40" y1="170" x2="760" y2="170" opacity="0.5"/>
    <line x1="40" y1="220" x2="760" y2="220" opacity="0.5"/>
    <line x1="40" y1="270" x2="760" y2="270" opacity="0.5"/>
    <line x1="40" y1="320" x2="760" y2="320" opacity="0.5"/>
    <line x1="40" y1="370" x2="760" y2="370" stroke-dasharray="4 3" opacity="0.3"/>
  </g>

  <!-- chunk boundaries, tiled per zoom level across the whole timeline -->
  <g>
    <rect x="40" y="115" width="721" height="10" fill="url(#t10)"/>
    <rect x="40" y="165" width="721" height="10" fill="url(#t20)"/>
    <rect x="40" y="215" width="721" height="10" fill="url(#t40)"/>
    <rect x="40" y="265" width="721" height="10" fill="url(#t80)"/>
    <rect x="40" y="315" width="721" height="10" fill="url(#t160)"/>
  </g>

  <!-- loaded chunks: extend past the visible range to chunk boundaries -->
  <g stroke="#3b82f6" stroke-width="2" clip-path="url(#timeline-clip)">
    <line x1="370" y1="120" x2="430" y2="120"/>
    <line x1="340" y1="170" x2="460" y2="170"/>
    <line x1="280" y1="220" x2="520" y2="220"/>
    <line x1="200" y1="270" x2="600" y2="270"/>
    <line x1="40" y1="320" x2="840" y2="320"/>
  </g>
  <line x1="40" y1="370" x2="760" y2="370" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3" opacity="0.45"/>

  <!-- visible-range envelope -->
  <polyline points="380,120 360,170 320,220 240,270 100,320" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polyline points="420,120 440,170 480,220 560,270 700,320" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="324" y="199" text-anchor="end" font-size="17" fill="#3b82f6">visible range</text>
  <line x1="328" y1="194" x2="340" y2="195" stroke="#3b82f6"/>
  <circle cx="340" cy="195" r="2.5" fill="#3b82f6"/>

  <!-- time cursor -->
  <line x1="400" y1="55" x2="400" y2="385" stroke="#ef4444" stroke-width="1.5"/>
  <text x="400" y="408" text-anchor="middle" font-size="17" fill="#ef4444">time</text>

  <!-- timeRange -->
  <line x1="100" y1="55" x2="100" y2="385" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <line x1="500" y1="55" x2="500" y2="385" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <text x="100" y="408" text-anchor="middle" font-size="17" fill="#f59e0b">timeRange[0]</text>
  <text x="500" y="408" text-anchor="middle" font-size="17" fill="#f59e0b">timeRange[1]</text>

  <!-- zoom axis -->
  <line x1="16" y1="320" x2="16" y2="120" stroke="#64748b" stroke-width="1.5"/>
  <path d="M16 110 l-5 10 h10 z" fill="#64748b"/>
  <text x="4" y="96" font-size="18" fill="#64748b">zoom</text>

  <!-- zoom level labels -->
  <text x="36" y="64" text-anchor="end" font-size="16" fill="#64748b" opacity="0.4">+3</text>
  <text x="36" y="114" text-anchor="end" font-size="16" fill="#64748b">+2</text>
  <text x="36" y="164" text-anchor="end" font-size="16" fill="#64748b">+1</text>
  <text x="36" y="214" text-anchor="end" font-size="16" fill="#64748b">0</text>
  <text x="36" y="264" text-anchor="end" font-size="16" fill="#64748b">−1</text>
  <text x="36" y="314" text-anchor="end" font-size="16" fill="#64748b">−2</text>
  <text x="36" y="364" text-anchor="end" font-size="16" fill="#64748b" opacity="0.4">−3</text>

  <!-- zoomRange -->
  <line x1="790" y1="120" x2="790" y2="320" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="790" y1="120" x2="782" y2="120" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="790" y1="320" x2="782" y2="320" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="808" y="220" text-anchor="middle" font-size="17" fill="#f59e0b" transform="rotate(90 808 220)">zoomRange [min, max]</text>

  <!-- annotations -->
  <path d="M200 225 v5 h40 v-5 M220 230 v9" fill="none" stroke="#64748b"/>
  <text x="220" y="254" text-anchor="middle" font-size="16" fill="#64748b">chunk</text>
  <text x="610" y="245" text-anchor="middle" font-size="17" fill="#3b82f6">loaded chunk</text>
  <line x1="610" y1="250" x2="580" y2="270" stroke="#3b82f6"/>
  <circle cx="580" cy="270" r="2.5" fill="#3b82f6"/>
</svg>
