<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" role="img" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <title>DataLoader and DataSource: acquisition and queries</title>
  <desc>A loader-backed DataSource acquires canonical rows through a DataLoader and provides rows to Series for a requested range and resolution.</desc>
  <defs>
    <marker id="pipeline-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="pipeline-request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="30" y="20" width="500" height="260" rx="8" fill="rgba(59,130,246,0.03)" stroke="#94a3b8"/>
  <text x="50" y="48" font-size="18" fill="#3b82f6">DataLoader</text>
  <g fill="none" stroke="#3b82f6" stroke-width="1.5">
    <rect x="50" y="70" width="140" height="44" rx="8"/>
    <rect x="210" y="70" width="140" height="44" rx="8"/>
    <rect x="370" y="70" width="140" height="44" rx="8"/>
    <rect x="100" y="191" width="160" height="42" rx="8"/>
    <rect x="300" y="191" width="160" height="42" rx="8"/>
  </g>
  <g font-size="16" fill="#3b82f6" text-anchor="middle">
    <text x="120" y="98">inline data</text>
    <text x="280" y="98">URL</text>
    <text x="440" y="98">callback</text>
    <text x="180" y="217">decoder</text>
    <text x="380" y="217">mappings</text>
  </g>
  <rect x="70" y="150" width="420" height="114" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="280" y="174" text-anchor="middle" font-size="16" fill="#64748b">optional transform</text>
  <text x="280" y="217" text-anchor="middle" font-size="15" fill="#64748b">or</text>
  <g fill="none" stroke="#64748b">
    <path d="M120 114 V135 H440 V114 M280 114 V135"/>
    <path d="M180 233 V249 H380 V233"/>
  </g>
  <g fill="none" stroke="#64748b" marker-end="url(#pipeline-flow)">
    <path d="M180 135 V187"/>
    <path d="M380 135 V187"/>
    <path d="M280 249 V332"/>
  </g>
  <text x="294" y="306" font-size="16" fill="#64748b">canonical rows</text>

  <rect x="70" y="338" width="420" height="82" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="90" y="366" font-size="18" fill="#f59e0b">DataSource</text>
  <text x="90" y="394" font-size="16" fill="#64748b">provide rows for range + resolution</text>
  <path d="M100 420 V468" fill="none" stroke="#64748b" marker-end="url(#pipeline-flow)"/>
  <text x="114" y="449" font-size="15" fill="#64748b">canonical rows</text>
  <path d="M300 475 V427" fill="none" stroke="#f59e0b" marker-end="url(#pipeline-request)"/>
  <g font-size="15" fill="#f59e0b">
    <text x="314" y="440">query</text>
    <text x="314" y="460">range + resolution</text>
  </g>
  <rect x="70" y="475" width="420" height="45" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="280" y="504" text-anchor="middle" font-size="17" fill="#3b82f6">Series</text>
</svg>
