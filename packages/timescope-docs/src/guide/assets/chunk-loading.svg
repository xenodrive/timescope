<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <title>Chunk alignment and display queries</title>
  <desc>The timeline is divided into chunks of chunkSize times the requested resolution, anchored to chunkOrigin. The visible range overlaps three chunks. Each selected chunk is queried from the DataSource using its full range and the same resolution.</desc>
  <defs>
    <marker id="chunk-query" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Queries travel upward from selected chunks to the DataSource. -->
  <rect x="300" y="20" width="360" height="55" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="55" text-anchor="middle" font-size="23" fill="#f59e0b">DataSource</text>
  <g fill="none" stroke="#3b82f6" marker-end="url(#chunk-query)">
    <path d="M360 150 V82"/>
    <path d="M480 150 V82"/>
    <path d="M600 150 V82"/>
  </g>
  <g font-size="21" fill="#3b82f6">
    <text x="374" y="122">query</text>
    <text x="494" y="122">query</text>
    <text x="614" y="122">query</text>
  </g>

  <!-- The origin is remote from the visible range; intervening chunks are omitted. -->
  <text x="30" y="110" font-size="22" fill="#f59e0b">chunkOrigin</text>
  <line x1="60" y1="120" x2="60" y2="235" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="60" y="150" width="120" height="60" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <g stroke="#3b82f6" fill="rgba(59,130,246,0.08)">
    <rect x="300" y="150" width="120" height="60"/>
    <rect x="420" y="150" width="120" height="60"/>
    <rect x="540" y="150" width="120" height="60"/>
  </g>
  <g font-size="21" text-anchor="middle">
    <text x="120" y="187" fill="#94a3b8">chunk 0</text>
    <text x="240" y="187" fill="#94a3b8">…</text>
    <text x="360" y="187" fill="#3b82f6">chunk n</text>
    <text x="480" y="187" fill="#3b82f6">chunk n+1</text>
    <text x="600" y="187" fill="#3b82f6">chunk n+2</text>
  </g>
  <path d="M30 210 H227 M253 210 H678 M230 216 l8 -12 M242 216 l8 -12" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M688 210 l-10 -5 v10 z" fill="#64748b"/>
  <text x="696" y="216" font-size="23" fill="#64748b">t</text>

  <!-- The visible range selects full chunks. -->
  <rect x="365" y="250" width="240" height="17" fill="rgba(59,130,246,0.15)" stroke="#3b82f6"/>
  <g stroke="#3b82f6" stroke-dasharray="4 3">
    <line x1="365" y1="210" x2="365" y2="250"/>
    <line x1="605" y1="210" x2="605" y2="250"/>
  </g>
  <text x="485" y="295" text-anchor="middle" font-size="21" fill="#3b82f6">visible range</text>

  <!-- Width annotation for one chunk, away from the visible-range marker. -->
  <path d="M60 245 V260 H180 V245 M120 260 V285" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="120" y="310" text-anchor="middle" font-size="22" fill="#64748b">chunkSize</text>
  <text x="120" y="337" text-anchor="middle" font-size="22" fill="#64748b">× resolution</text>
</svg>
