<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <title>Independent and shared Domains without visible value axes</title>
  <desc>Two linear Series are overlaid on one Track. With independent ranges of zero to ten and zero to one hundred, values five and fifty appear at the same height. Sharing a range of zero to one hundred makes their heights comparable. The range labels are explanatory annotations, not rendered axes.</desc>

  <text x="280" y="28" text-anchor="middle" font-size="18" fill="#64748b">Independent inline Domains</text>
  <text x="60" y="58" font-size="17" fill="#3b82f6">A: range 0–10</text>
  <text x="315" y="58" font-size="17" fill="#b45309">B: range 0–100</text>
  <rect x="40" y="75" width="480" height="110" rx="4" fill="rgba(148,163,184,0.04)" stroke="#94a3b8"/>
  <polyline points="65,165 145,105 225,135 385,85 495,185" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <polyline points="65,185 145,155 335,135 415,85 495,115" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <line x1="225" y1="135" x2="335" y2="135" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <circle cx="225" cy="135" r="5" fill="#3b82f6"/>
  <circle cx="335" cy="135" r="5" fill="#f59e0b"/>
  <text x="225" y="120" text-anchor="middle" font-size="17" fill="#3b82f6">5</text>
  <text x="335" y="120" text-anchor="middle" font-size="17" fill="#b45309">50</text>
  <text x="280" y="213" text-anchor="middle" font-size="17" fill="#64748b">Same height ≠ same value</text>

  <text x="280" y="256" text-anchor="middle" font-size="18" fill="#64748b">Shared Domain · range 0–100</text>
  <rect x="40" y="275" width="480" height="110" rx="4" fill="rgba(148,163,184,0.04)" stroke="#94a3b8"/>
  <polyline points="65,383 145,377 225,380 385,375 495,385" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <polyline points="65,385 145,355 335,335 415,285 495,315" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="225" cy="380" r="5" fill="#3b82f6"/>
  <circle cx="335" cy="335" r="5" fill="#f59e0b"/>
  <text x="225" y="365" text-anchor="middle" font-size="17" fill="#3b82f6">5</text>
  <text x="335" y="320" text-anchor="middle" font-size="17" fill="#b45309">50</text>
</svg>
