<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" role="img" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <title>Independent Domains share a Track baseline</title>
  <desc>One Track contains two linear Domains with ranges minus ten to ten and minus one hundred to one hundred. Their scales differ, but both map zero to the Track's shared baseline, referenced by #zero. Positive values appear above the baseline and negative values below it.</desc>
  <text x="280" y="27" text-anchor="middle" font-size="18" fill="#64748b">Different Domains · one Track</text>
  <text x="50" y="55" font-size="17" fill="#3b82f6">A: range −10 to 10</text>
  <text x="295" y="55" font-size="17" fill="#b45309">B: range −100 to 100</text>
  <rect x="40" y="75" width="480" height="170" rx="4" fill="rgba(148,163,184,0.04)" stroke="#94a3b8"/>
  <line x1="40" y1="160" x2="520" y2="160" stroke="#64748b" stroke-width="1.5"/>
  <polyline points="65,115 145,95 225,160 335,200 415,140 495,110" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <polyline points="65,200 145,220 225,200 335,160 415,105 495,130" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="225" cy="160" r="5" fill="#3b82f6"/>
  <circle cx="335" cy="160" r="5" fill="#f59e0b"/>
  <text x="230" y="142" font-size="17" fill="#3b82f6">0</text>
  <text x="340" y="185" font-size="17" fill="#b45309">0</text>
  <path d="M520 160 H540 V271 H400" fill="none" stroke="#64748b"/>
  <text x="280" y="277" text-anchor="middle" font-size="17" fill="#64748b">Shared baseline · #zero</text>
</svg>
